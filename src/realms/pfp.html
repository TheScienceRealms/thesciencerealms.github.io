<!doctype html><html><head><meta charset="utf-8">

 <g transform="translate(66,96)">

 </g>

 <g fill="#e2bd5a"><use href="#spark" x="394" y="170"/><use href="#spark" x="118" y="176" transform="translate(118,176) scale(.6) translate(-118,-176)"/></g>
 <text x="256" y="410" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="16" letter-spacing="5" fill="#c6d2c0">THE SCIENCE REALMS</text>
